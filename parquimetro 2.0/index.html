    <title>Simulador de Parquímetro</title>
    <link rel="stylesheet" href="./styles.css">

<body>
    <main class="container">
        <h1>Simulador de Parquímetro</h1>


    <p>Informe o valor que deseja inserir para calcular o tempo de estacionamento.</p>

    <form id="form-parquimetro">
        <label for="valor">Valor em reais (R$):</label>
        <input
            type="number"
            id="valor"
            name="valor"
            min="0"
            step="0.01"
            placeholder="Ex.: 2.50"
            required
        >
        <button type="submit">Calcular estacionamento</button>
    </form>

    <section id="resultado" aria-live="polite">
        <p>O resultado aparecerá aqui.</p>
    </section>
</main>
